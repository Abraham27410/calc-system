name: Docker Hub Push and Server Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  build-push-deploy:
    name: Build Docker Image, Push to Hub, Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code into the runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up the Docker Build engine inside the GitHub runner
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log into personal Docker Hub account using saved secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build Dockerfile and push it live to Docker Hub
      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/vuna-calculator:latest

      # Step 5: Securely connect over SSH and force synchronize code via git reset
      - name: Execute Remote SSH Pull
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '${{ secrets.SERVER_HOST }}'
          username: '${{ secrets.SERVER_USER }}'
          password: '${{ secrets.SERVER_PASSWORD }}'
          port: 22
          script: |
            # Create the folder if it doesn't exist and enter it
            mkdir -p public_html
            cd public_html
            
            # Initialize local git if the folder was left uninitialized
            git init
            
            # Re-register his specific repository remote destination safely
            git remote remove origin 2>/dev/null || true
            git remote add origin https://github.com/Abraham27410/calc-system.git
            
            # Download his fresh source updates directly into the working directory
            git fetch --all
            
            # Match the deployment precisely to his main tracking branch, bypassing root file holds
            git reset --hard origin/main || git reset --hard origin/master