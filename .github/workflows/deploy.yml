name: Docker Hub Push and Server Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  build-push-deploy:
    name: Build Docker Image, Push to Hub, Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code into the runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up the Docker Build engine inside the GitHub runner
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log into personal Docker Hub account using saved secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build Dockerfile and push it live to Docker Hub
      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/vuna-calculator:latest

      # Step 5: Securely connect over SSH and bypass rbash using git -C flags
      - name: Execute Remote SSH Pull
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '${{ secrets.SERVER_HOST }}'
          username: '${{ secrets.SERVER_USER }}'
          password: '${{ secrets.SERVER_PASSWORD }}'
          port: 22
          script: |
            # 1. Ensure the deployment directory exists
            mkdir -p public_html
            
            # 2. Tell Git to trust this directory to solve the dubious ownership error
            git config --global --add safe.directory public_html
            
            # 3. Initialize Git directly in the public_html target folder without using 'cd'
            git -C public_html init
            
            # 4. Safely set up the remote tracking origin pointing to his code
            git -C public_html remote remove origin || true
            git -C public_html remote add origin https://github.com/Abraham27410/calc-system.git
            
            # 5. Fetch code directly into public_html
            git -C public_html fetch --all
            
            # 6. Hard reset tracked files over the directory to finish deployment
            git -C public_html reset --hard origin/main || git -C public_html reset --hard origin/master